server:
  port: 0
spring:
  application:
    name: calendar-service
  cloud:
    nacos:
      config:
        enabled: false
        import-check:
          enabled: false
      discovery:
        enabled: false
  ai:
    model:
      chat: none
  datasource:
    url: jdbc:h2:mem:aistartup;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  sql:
    init:
      mode: never
cloud:
  token-secret: test-token-secret-at-least-32-characters
  internal-key: test-internal-key
  ai:
    enabled: false
    bridge-secret: test-only-bridge-key-at-least-32-characters
mybatis:
  mapper-locations: classpath*:mapper/*.xml
