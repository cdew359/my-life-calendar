server:
  port: ${PORT:8801}
  tomcat:
    threads:
      max: 12
      min-spare: 2
    max-http-form-post-size: 2MB
spring:
  config:
    import:
      - "nacos:calendar-common.yml?group=CALENDAR&refreshEnabled=true"
      - "nacos:user-service.yml?group=CALENDAR&refreshEnabled=true"
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:}
      config:
        namespace: ${NACOS_NAMESPACE:public}
      discovery:
        namespace: ${NACOS_NAMESPACE:public}
        group: CALENDAR
        network-interface: ${NACOS_NETWORK_INTERFACE:}
  application:
    name: user-service
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3307/calendar_cloud?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USER:calendar_cloud}
    password: ${MYSQL_PASSWORD}
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 5000
  sql:
    init:
      mode: always
  jackson:
    deserialization:
      fail-on-trailing-tokens: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD}
      timeout: 2s
      connect-timeout: 2s
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
cloud:
  token-secret: ${TOKEN_SECRET}
  internal-key: ${INTERNAL_KEY}
  register-code: ${REGISTER_CODE}
  token-days: ${TOKEN_DAYS:30}
logging:
  level:
    com.alibaba.nacos: WARN
    com.alibaba.cloud.nacos: WARN
    org.springframework.cloud.loadbalancer: ERROR

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    local-cache-scope: STATEMENT
