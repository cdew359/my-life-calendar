server {
    listen 80 default_server;
    server_name _;
    return 404;
}

server {
    listen 80;
    server_name imlaomi.cn cal.imlaomi.cn;
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name imlaomi.cn;
    ssl_certificate /etc/letsencrypt/live/imlaomi.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/imlaomi.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/calendar/site;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    location /downloads/ { alias /srv/calendar/downloads/; }
    location = /site { return 301 /; }
    location /site/ { return 301 https://imlaomi.cn/; }
    location / { try_files $uri $uri/ =404; }
}

server {
    listen 443 ssl;
    server_name cal.imlaomi.cn;
    ssl_certificate /etc/letsencrypt/live/imlaomi.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/imlaomi.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/calendar;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    location = /index.html { add_header Cache-Control "no-cache"; }
    location /site/ { return 301 https://imlaomi.cn/; }
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $backend calendar-sync:8788;
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 2m;
    }
    location /downloads/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
