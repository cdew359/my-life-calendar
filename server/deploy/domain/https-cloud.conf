# Explicit public API allowlist. Never publish /internal/ or /actuator/.
map $uri $calendar_cloud_backend {
    default "";
    ~^/(?:cloud-api/)?api/(?:login|register|accounts|profile|health)$ calendar-cloud-trial-user-service-1:8801;
    ~^/(?:cloud-api/)?api/data$ calendar-cloud-trial-calendar-service-1:8802;
    ~^/(?:cloud-api/)?api/ai/(?:capabilities|events/interpret|knowledge/ask)$ calendar-cloud-trial-calendar-service-1:8802;
    ~^/(?:cloud-api/)?api/diaries/ calendar-cloud-trial-diary-service-1:8803;
}

server {
    listen 80 default_server;
    server_name _;
    return 404;
}

server {
    listen 80;
    server_name imlaomi.cn cal.imlaomi.cn;
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name imlaomi.cn;
    ssl_certificate /etc/letsencrypt/live/imlaomi.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/imlaomi.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/calendar/site;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    location /downloads/ { alias /srv/calendar/downloads/; }
    location = /site { return 301 /; }
    location /site/ { return 301 https://imlaomi.cn/; }
    location / { try_files $uri $uri/ =404; }
}

server {
    listen 443 ssl;
    server_name cal.imlaomi.cn;

    # BEGIN CALENDAR CLOUD TRIAL
    location = /cloud { return 301 /cloud/; }
    location ^~ /cloud/ {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /cloud/index.html;
    }
    location /cloud-api/ {
        proxy_read_timeout 15s;
        # Include inside the public /api/ and compatible /cloud-api/ locations.
        if (-f /srv/calendar/shared-maintenance.flag) {
            return 503 '{"error":"正在升级，请稍后重试，本地数据已保留"}';
        }
        if ($calendar_cloud_backend = "") { return 404; }
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        add_header Access-Control-Max-Age "600" always;
        add_header X-Calendar-Backend "spring-cloud-nginx" always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        if ($request_method = OPTIONS) { return 204; }
        rewrite ^/cloud-api/(.*)$ /$1 break;
        resolver 127.0.0.11 valid=5s;
        proxy_pass http://$calendar_cloud_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Account-Id "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        client_max_body_size 2m;
        proxy_intercept_errors on;
        error_page 502 504 = @calendar_cloud_unavailable;
    }
    # END CALENDAR CLOUD TRIAL

    ssl_certificate /etc/letsencrypt/live/imlaomi.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/imlaomi.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/calendar;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    location = /index.html { add_header Cache-Control "no-cache"; }
    location /site/ { return 301 https://imlaomi.cn/; }
    location ~ ^/(?:cloud-api/)?api/ai/(?:capabilities|events/interpret|knowledge/ask)$ {
        proxy_read_timeout 45s;
        # Include inside the public /api/ and compatible /cloud-api/ locations.
        if (-f /srv/calendar/shared-maintenance.flag) {
            return 503 '{"error":"正在升级，请稍后重试，本地数据已保留"}';
        }
        if ($calendar_cloud_backend = "") { return 404; }
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        add_header Access-Control-Max-Age "600" always;
        add_header X-Calendar-Backend "spring-cloud-nginx" always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        if ($request_method = OPTIONS) { return 204; }
        rewrite ^/cloud-api/(.*)$ /$1 break;
        resolver 127.0.0.11 valid=5s;
        proxy_pass http://$calendar_cloud_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Account-Id "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        client_max_body_size 2m;
        proxy_intercept_errors on;
        error_page 502 504 = @calendar_cloud_unavailable;
    }
    location /api/ {
        proxy_read_timeout 15s;
        # Include inside the public /api/ and compatible /cloud-api/ locations.
        if (-f /srv/calendar/shared-maintenance.flag) {
            return 503 '{"error":"正在升级，请稍后重试，本地数据已保留"}';
        }
        if ($calendar_cloud_backend = "") { return 404; }
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        add_header Access-Control-Max-Age "600" always;
        add_header X-Calendar-Backend "spring-cloud-nginx" always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        if ($request_method = OPTIONS) { return 204; }
        resolver 127.0.0.11 valid=5s;
        proxy_pass http://$calendar_cloud_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Account-Id "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        client_max_body_size 2m;
        proxy_intercept_errors on;
        error_page 502 504 = @calendar_cloud_unavailable;
    }
    location @calendar_cloud_unavailable {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Calendar-Backend "spring-cloud-nginx" always;
        return 503 '{"error":"服务暂时不可用，请保留本地数据后重试"}';
    }
    location ^~ /internal/ { return 404; }
    location ^~ /actuator/ { return 404; }
    location /downloads/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
