# nginx 站点配置示例（备案通过后启用；证书用腾讯云免费 DV 或 certbot）
# 放置：/etc/nginx/conf.d/cal.imlaomi.cn.conf
#
# 生成 DH 参数与证书路径按实际调整；HTTP 一律 301 到 HTTPS

server {
    listen 80;
    server_name cal.imlaomi.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name cal.imlaomi.cn;

    ssl_certificate     /etc/nginx/certs/cal.imlaomi.cn.pem;
    ssl_certificate_key /etc/nginx/certs/cal.imlaomi.cn.key;

    # 静态前端（vite build 产物，部署到 /opt/my-life/calendar/dist）
    root /opt/my-life/calendar/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 同步 API 反代到容器
    location /api/ {
        proxy_pass http://calendar-sync:8788;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 2m;
    }
}
