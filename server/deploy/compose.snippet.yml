# 追加到照见的 docker-compose.prod.yml 的 services 下（同一网络，共用重启策略）
#
# 构建：cd /opt/my-life/calendar && docker build -f server/Dockerfile -t calendar-sync .
#
calendar-sync:
  build:
    context: ./calendar
    dockerfile: server/Dockerfile
  container_name: calendar-sync
  restart: unless-stopped
  environment:
    - NODE_ENV=production
    - PORT=8788
    - DATA_DIR=/data
    - PASSWORD_HASH=${CALENDAR_PASSWORD_HASH} # npm run hash 生成，写进 deploy/.env
    - SECRET=${CALENDAR_SECRET} # openssl rand -hex 32 生成
  volumes:
    - ./calendar-data:/data
  expose:
    - "8788"
