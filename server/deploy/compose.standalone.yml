# 日历表同步 API + 网页 · 独立部署（不改动照见的 compose）
# 放置：/opt/my-life/calendar/docker-compose.yml
# 启动：cd /opt/my-life/calendar && sudo docker compose up -d --build
#
# 密钥写在同目录 .env（gitignore）：
#   CALENDAR_REGISTER_CODE=注册码（开新账号要用，只告诉信任的人）
#   CALENDAR_SECRET=openssl rand -hex 32
services:
  calendar-sync:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: calendar-sync
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=8788
      - DATA_DIR=/data
      - REGISTER_CODE=${CALENDAR_REGISTER_CODE}
      - SECRET=${CALENDAR_SECRET}
    volumes:
      - ./data:/data
    networks:
      - zhaojian

  # 过渡方案：8080 端口提供网页 + /api 反代（备案通过后由宿主 nginx 443 取代）
  calendar-web:
    image: nginx:alpine
    container_name: calendar-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./server/deploy/nginx-web.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - calendar-sync
    networks:
      - zhaojian

networks:
  zhaojian:
    external: true
    name: my-life_zhaojian
