# Local development only. Loopback ports cannot be reached from the network.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: calendar_diary
      POSTGRES_PASSWORD: local-diary-only
      POSTGRES_DB: calendar_diary
    ports: ["127.0.0.1:5544:5432"]
    volumes: ["diary_pg:/var/lib/postgresql/data"]
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.23
    mem_limit: 1g
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.ml.enabled: "false"
      ES_JAVA_OPTS: "-Xms256m -Xmx256m"
    ports: ["127.0.0.1:9200:9200"]
    volumes: ["diary_es:/usr/share/elasticsearch/data"]
volumes:
  diary_pg:
  diary_es:
